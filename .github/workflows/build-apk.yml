
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS" || exit 1
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Fix WebView setting
        run: |
          sed -i 's/webView\.javaScriptEnabled/webView.settings.javaScriptEnabled/g' "$PROJECT_DIR/app/src/main/java/com/chacha/ebook/MainActivity.kt"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChachaEbookReader-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error


